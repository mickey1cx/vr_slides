<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VR Стерео-галерея · Quest 3</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1><span data-i18n="heading">VR Стерео-галерея</span> <small data-i18n="headingSmall">Quest 3 · SBS</small></h1>
    <div class="bar">
      <label><span data-i18n="languageLabel">Язык</span> <select id="langSelect"></select></label>
      <label><span data-i18n="rootLabel">Каталог</span> <select id="rootSelect"></select></label>
      <button id="upBtn" data-i18n="up" data-i18n-title="up" title="↑ Назад">↑ Назад</button>
      <button id="firstBtn" data-i18n="first" data-i18n-title="first" title="В начало">⏮ В начало</button>
      <button id="lastBtn" data-i18n="last" data-i18n-title="last" title="В конец">В конец ⏭</button>
      <button id="deleteBtn" data-i18n="deleteSelected" data-i18n-title="deleteSelected" title="Удалить отмеченные" disabled>Удалить отмеченные (0)</button>
      <a id="qrLink" class="qr-link" href="/qr" target="_blank" rel="noopener" data-i18n="qrLink" data-i18n-title="qrLink" title="QR-код">QR-код</a>
      <span id="crumb" class="crumb"></span>
      <span class="spacer"></span>
      <span id="url" class="url"></span>
    </div>
  </header>

  <main>
    <section class="browser">
      <div id="error" class="error" hidden></div>
      <div id="grid" class="grid"></div>
    </section>

    <aside class="viewer">
      <div id="preview" class="preview"></div>
      <div id="info" class="info"></div>
      <button id="vrBtn" class="primary" disabled data-i18n="enterVR">Войти в VR</button>
      <fieldset class="view-settings">
        <legend data-i18n="layoutSettings">Формат стереопары</legend>
        <label class="setting">
          <span data-i18n="layoutDirLabel">Для каталога</span>
          <select id="layoutDirSelect">
            <option value="auto" data-i18n="layoutAuto">Автоопределение</option>
            <option value="mono" data-i18n="layoutMono">2D (моно)</option>
            <option value="sbs" data-i18n="layoutSbs">SBS / Full-SBS</option>
            <option value="half" data-i18n="layoutHalf">Half-SBS</option>
            <option value="ou" data-i18n="layoutOu">OU / TAB (Full)</option>
            <option value="hou" data-i18n="layoutHou">HOU (Half-OU)</option>
            <option value="pano" data-i18n="layoutPano">360° панорама</option>
          </select>
        </label>
        <label class="setting">
          <span data-i18n="layoutLabel">Для фото</span>
          <select id="layoutSelect" disabled>
            <option value="root" data-i18n="layoutFromRoot">Как в каталоге</option>
            <option value="auto" data-i18n="layoutAuto">Автоопределение</option>
            <option value="mono" data-i18n="layoutMono">2D (моно)</option>
            <option value="sbs" data-i18n="layoutSbs">SBS / Full-SBS</option>
            <option value="half" data-i18n="layoutHalf">Half-SBS</option>
            <option value="ou" data-i18n="layoutOu">OU / TAB (Full)</option>
            <option value="hou" data-i18n="layoutHou">HOU (Half-OU)</option>
            <option value="pano" data-i18n="layoutPano">360° панорама</option>
          </select>
        </label>
        <label class="setting">
          <span data-i18n="panoProjection">Проекция 360°</span>
          <select id="panoModeSelect" disabled>
            <option value="sphere" data-i18n="panoSphere">Сфера</option>
            <option value="cylinder" data-i18n="panoCylinder">Цилиндр</option>
          </select>
        </label>
        <label class="setting check">
          <input id="layoutSwap" type="checkbox" disabled>
          <span data-i18n="layoutSwap">Поменять глаза (RL / BT)</span>
        </label>
        <div id="layoutInfo" class="layout-info"></div>
      </fieldset>
      <fieldset class="view-settings">
        <legend data-i18n="viewSettings">Настройки вида</legend>
        <label class="setting">
          <span data-i18n="panXLabel">Панорама ↔</span>
          <input id="panXRange" type="range" min="-100" max="100" step="1" value="0">
          <output id="panXValue">0%</output>
        </label>
        <label class="setting">
          <span data-i18n="panYLabel">Панорама ↕</span>
          <input id="panYRange" type="range" min="-100" max="100" step="1" value="0">
          <output id="panYValue">0%</output>
        </label>
        <label class="setting">
          <span data-i18n="shiftLabel">Стерео-сдвиг</span>
          <input id="shiftRange" type="range" min="-10" max="10" step="0.5" value="0">
          <output id="shiftValue">0%</output>
        </label>
        <button id="resetViewBtn" data-i18n="resetView" disabled>Сбросить вид</button>
      </fieldset>
      <label class="setting">
        <span data-i18n="curveLabel">Изгиб экрана</span>
        <input id="curveRange" type="range" min="0" max="100" step="1" value="0">
        <output id="curveValue">0%</output>
      </label>
      <div class="hint">
        <b data-i18n="questHintPrefix">На Quest 3 откройте</b> <span id="questUrl" class="mono"></span>
        <span data-i18n="questHintSuffix">в браузере и примите предупреждение о сертификате.</span><br>
        <b data-i18n="vrHintPrefix">В VR:</b> <span data-i18n="vrHint2D">триггер — следующее фото, grip — предыдущее, grip + стик ↑↓ — изгиб экрана.</span><br>
        <span data-i18n="galleryNavHint"></span>
      </div>
    </aside>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>

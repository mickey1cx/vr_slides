<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VR Стерео-галерея · Quest 3</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1><span data-i18n="heading">VR Стерео-галерея</span> <small data-i18n="headingSmall">Quest 3 · SBS</small></h1>
    <div class="bar">
      <label><span data-i18n="languageLabel">Язык</span> <select id="langSelect"></select></label>
      <label><span data-i18n="rootLabel">Каталог</span> <select id="rootSelect"></select></label>
      <button id="upBtn" data-i18n="up" data-i18n-title="up" title="↑ Назад">↑ Назад</button>
      <button id="firstBtn" data-i18n="first" data-i18n-title="first" title="В начало">⏮ В начало</button>
      <button id="lastBtn" data-i18n="last" data-i18n-title="last" title="В конец">В конец ⏭</button>
      <button id="deleteBtn" data-i18n="deleteSelected" data-i18n-title="deleteSelected" title="Удалить отмеченные" disabled>Удалить отмеченные (0)</button>
      <span id="crumb" class="crumb"></span>
      <span class="spacer"></span>
      <span id="url" class="url"></span>
    </div>
  </header>

  <main>
    <section class="browser">
      <div id="error" class="error" hidden></div>
      <div id="grid" class="grid"></div>
    </section>

    <aside class="viewer">
      <h2 data-i18n="selected">Выбранное</h2>
      <div id="preview" class="preview"></div>
      <div id="info" class="info"></div>
      <button id="markBtn" data-i18n="markTitle" data-i18n-title="markTitle" title="Пометить / снять пометку" disabled>Пометить / снять пометку</button>
      <label class="setting">
        <span data-i18n="curveLabel">Изгиб экрана</span>
        <input id="curveRange" type="range" min="0" max="100" step="1" value="0">
        <output id="curveValue">0%</output>
      </label>
      <button id="vrBtn" class="primary" disabled data-i18n="enterVR">Войти в VR</button>
      <div class="hint">
        <b data-i18n="questHintPrefix">На Quest 3 откройте</b> <span id="questUrl" class="mono"></span>
        <span data-i18n="questHintSuffix">в браузере и примите предупреждение о сертификате.</span><br>
        <b data-i18n="vrHintPrefix">В VR:</b> <span data-i18n="vrHint2D">триггер — следующее фото, grip — предыдущее, grip + стик ↑↓ — изгиб экрана.</span><br>
        <span data-i18n="galleryNavHint"></span>
      </div>
    </aside>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
